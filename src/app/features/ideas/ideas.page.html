<app-page-header
  title="Idea generator"
  subtitle="Generate hooks and concepts for your next content batch."
/>

<mat-card class="app-card">
  <div class="p-4">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex items-center gap-3">
        <div class="text-sm font-medium text-slate-700">Topic</div>
        <mat-form-field appearance="outline" class="w-[240px]">
          <input
            matInput
            [value]="store.topic()"
            (input)="store.setTopic($any($event.target).value)"
            placeholder="e.g. padel, football"
          />
        </mat-form-field>
      </div>

      <button
        mat-flat-button
        color="primary"
        (click)="store.generateForCurrentTopic()"
        [disabled]="store.loading()"
      >
        Generate 5 ideas
      </button>
    </div>

    @if (store.loading()) {
      <mat-progress-bar mode="indeterminate" class="mt-3"></mat-progress-bar>
    }

    @defer (when store.ideas().length > 0) {
      <div class="mt-4 grid gap-3 lg:grid-cols-2">
        @for (idea of store.ideas(); track idea.id) {
          <div class="rounded-xl border border-slate-200 bg-white p-4">
            <div class="text-xs uppercase tracking-[0.16em] text-slate-400">
              {{ idea.topic }}
            </div>
            <div class="mt-1 text-sm font-semibold text-slate-900">{{ idea.hook }}</div>
            <div class="mt-2 text-sm text-slate-600">{{ idea.description }}</div>
            <div class="mt-3 flex flex-wrap gap-2">
              <span class="rounded-full bg-slate-100 px-2 py-1 text-xs text-slate-700">
                Why it could go viral
              </span>
              <span class="rounded-full bg-sky-50 px-2 py-1 text-xs text-sky-700">
                {{ idea.whyViral }}
              </span>
            </div>
          </div>
        }
      </div>
    } @placeholder {
      <div class="mt-4 text-sm text-slate-400">
        Ideas will appear here after generation.
      </div>
    }
  </div>
</mat-card>
